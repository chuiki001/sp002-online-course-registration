version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sp002_user
      POSTGRES_PASSWORD: sp002_password
      POSTGRES_DB: sp002_portal
    ports:
      - "5432:5432"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://sp002_user:sp002_password@db:5432/sp002_portal
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db
