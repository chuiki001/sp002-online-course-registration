name: SP-002 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Analysis (Ruff)
        run: ruff check app tests

      - name: Security Vulnerability Scan (Bandit)
        run: bandit -r app -ll

      - name: Run Unit & Integration Tests with Coverage (>= 60%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60
